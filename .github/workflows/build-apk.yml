name: Build Memo Printer APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP"

          mkdir -p build_project
          unzip -q "$ZIP" -d build_project

          SETTINGS=$(find build_project -name settings.gradle -type f | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            find build_project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      - name: Apply Saved Memos date-folder update
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 "$GITHUB_WORKSPACE/patch_v31.py"
          python3 "$GITHUB_WORKSPACE/patch_v32.py"
          python3 "$GITHUB_WORKSPACE/patch_v34.py"
          python3 "$GITHUB_WORKSPACE/patch_v35.py"
          python3 "$GITHUB_WORKSPACE/patch_v36.py"


      - name: Add Summary Printer
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cp "$GITHUB_WORKSPACE/SalesFeaturesActivity.java" app/src/main/java/com/memoprinter/eighty/SalesFeaturesActivity.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/memoprinter/eighty/MainActivity.java")
          s=p.read_text(encoding="utf-8")
          anchor='        c.addView(r3,new LinearLayout.LayoutParams(-1,dp(142)));\n        c.addView(gap(10));\n\n        LinearLayout info=card();'
          insert='        c.addView(r3,new LinearLayout.LayoutParams(-1,dp(142)));\n        c.addView(gap(10));\n\n        LinearLayout r4=new LinearLayout(this); r4.setOrientation(LinearLayout.HORIZONTAL);\n        homeCard(r4,"🧾","Summary","Saved memos summary",v->{Intent i=new Intent(this,SalesFeaturesActivity.class);i.putExtra("mode","summary");startActivity(i);});\n        c.addView(r4,new LinearLayout.LayoutParams(-1,dp(142)));\n        c.addView(gap(10));\n\n        LinearLayout info=card();'
          if anchor not in s: raise SystemExit("home anchor missing")
          s=s.replace(anchor,insert,1)
          p.write_text(s,encoding="utf-8")
          m=Path("app/src/main/AndroidManifest.xml")
          ms=m.read_text(encoding="utf-8")
          act='        <activity android:name=".SalesFeaturesActivity" android:exported="false" />\n'
          if "SalesFeaturesActivity" not in ms: ms=ms.replace("    </application>",act+"    </application>")
          m.write_text(ms,encoding="utf-8")
          PY
      - name: Inspect MainActivity source
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo '--- MAIN ACTIVITY ---'
          find app/src/main/java -name 'MainActivity.java' -o -name 'MainActivity.kt' | head -5
          FILE=$(find app/src/main/java -name 'MainActivity.java' -o -name 'MainActivity.kt' | head -1)
          echo "FILE=$FILE"
          sed -n '1,260p' "$FILE"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fix Kotlin dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat >> app/build.gradle <<'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MemoPrinter80mm-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build Memo Printer APK

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi
          echo "Found ZIP: $ZIP"
          mkdir -p build_project
          unzip -q "$ZIP" -d build_project
          SETTINGS=$(find build_project -name settings.gradle -type f | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Apply Saved Memos date-folder update
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 "$GITHUB_WORKSPACE/patch_v31.py"
          python3 "$GITHUB_WORKSPACE/patch_v32.py"
          python3 "$GITHUB_WORKSPACE/patch_v34.py"
          python3 "$GITHUB_WORKSPACE/patch_v35.py"
          python3 "$GITHUB_WORKSPACE/patch_v36.py"
          python3 "$GITHUB_WORKSPACE/patch_v37.py"
          python3 "$GITHUB_WORKSPACE/patch_v38.py"
          python3 "$GITHUB_WORKSPACE/patch_v39.py"
          python3 "$GITHUB_WORKSPACE/patch_v40.py"

      - name: Add Summary Printer
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cp "$GITHUB_WORKSPACE/SalesFeaturesActivity.java" app/src/main/java/com/memoprinter/eighty/SalesFeaturesActivity.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/memoprinter/eighty/MainActivity.java")
          s=p.read_text(encoding="utf-8")
          anchor='        c.addView(r3,new LinearLayout.LayoutParams(-1,dp(142)));\n        c.addView(gap(10));\n\n        LinearLayout info=card();'
          insert='        c.addView(r3,new LinearLayout.LayoutParams(-1,dp(142)));\n        c.addView(gap(10));\n\n        LinearLayout r4=new LinearLayout(this); r4.setOrientation(LinearLayout.HORIZONTAL);\n        homeCard(r4,"🧾","Summary","Saved memos summary",v->{Intent i=new Intent(this,SalesFeaturesActivity.class);i.putExtra("mode","summary");startActivity(i);});\n        c.addView(r4,new LinearLayout.LayoutParams(-1,dp(142)));\n        c.addView(gap(10));\n\n        LinearLayout info=card();'
          if anchor not in s: raise SystemExit("home anchor missing")
          s=s.replace(anchor,insert,1)
          p.write_text(s,encoding="utf-8")
          m=Path("app/src/main/AndroidManifest.xml")
          ms=m.read_text(encoding="utf-8")
          act='        <activity android:name=".SalesFeaturesActivity" android:exported="false" />\n'
          if "SalesFeaturesActivity" not in ms:
              ms=ms.replace("    </application>",act+"    </application>")
          m.write_text(ms,encoding="utf-8")
          PY

      - name: Replace memo template at original size
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request
          from PIL import Image, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES=True
          old=Path('app/src/main/res/drawable-nodpi/memo_template.jpg')
          new=Path('/tmp/new_memo_template.png')
          url='https://raw.githubusercontent.com/mdrafi2038-glitch/MemoPrinter80mm/1f1fec8d28e341772c6b8637752e2d6a703bcdd0/new_memo_template.png'
          urllib.request.urlretrieve(url,new)
          with Image.open(old) as ref:
              size=ref.size
          with Image.open(new) as src:
              # The uploaded template may contain transparency. Converting RGBA
              # directly to RGB makes transparent pixels black, which causes
              # the Preview to appear as a giant black rectangle.
              if src.mode in ('RGBA','LA') or 'transparency' in src.info:
                  src=src.convert('RGBA')
                  bg=Image.new('RGB',src.size,'white')
                  bg.paste(src,(0,0),src.getchannel('A'))
                  src=bg
              else:
                  src=src.convert('RGB')
              src=src.resize(size,Image.Resampling.LANCZOS)
              src.save('app/src/main/res/drawable-nodpi/memo_template.jpg','JPEG',quality=95)
          print('New memo resized to original template size:',size)
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fix Kotlin dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat >> app/build.gradle <<'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MemoPrinter80mm-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

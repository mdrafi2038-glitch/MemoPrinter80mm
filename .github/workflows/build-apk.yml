name: Build Memo Printer APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP"

          mkdir -p build_project
          unzip -q "$ZIP" -d build_project

          SETTINGS=$(find build_project -name settings.gradle -type f | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            find build_project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      - name: Export source for integration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo '--- FILE LIST ---' > ../SOURCE_INSPECT.txt
          find . -type f ! -path './.gradle/*' ! -path './build/*' ! -path './app/build/*' | sort >> ../SOURCE_INSPECT.txt
          echo '' >> ../SOURCE_INSPECT.txt
          echo '--- MANIFEST ---' >> ../SOURCE_INSPECT.txt
          find app/src/main -name AndroidManifest.xml -print -exec sed -n '1,240p' {} \; >> ../SOURCE_INSPECT.txt
          echo '' >> ../SOURCE_INSPECT.txt
          echo '--- MAIN ACTIVITY FILES ---' >> ../SOURCE_INSPECT.txt
          for f in $(find app/src/main/java -name 'MainActivity.java' -o -name 'MainActivity.kt'); do echo "### $f" >> ../SOURCE_INSPECT.txt; sed -n '1,2000p' "$f" >> ../SOURCE_INSPECT.txt; done
          echo '' >> ../SOURCE_INSPECT.txt
          wc -l app/src/main/java/com/memoprinter/eighty/MainActivity.java > ../SOURCE_LINES.txt
          sed -n '501,1000p' app/src/main/java/com/memoprinter/eighty/MainActivity.java > ../SOURCE_MAIN_501_1000.txt
          sed -n '1001,1500p' app/src/main/java/com/memoprinter/eighty/MainActivity.java > ../SOURCE_MAIN_1001_1500.txt
          sed -n '1501,2000p' app/src/main/java/com/memoprinter/eighty/MainActivity.java > ../SOURCE_MAIN_1501_2000.txt
          echo '--- RESOURCES ---' >> ../SOURCE_INSPECT.txt
          find app/src/main/res -type f \( -name '*.xml' -o -name '*.json' \) -print | sort | while read f; do echo "### $f" >> ../SOURCE_INSPECT.txt; sed -n '1,300p' "$f" >> ../SOURCE_INSPECT.txt; done
          cd "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE_INSPECT.txt
          git commit -m 'Temporary source inspection' || true
          git push
      - name: Inspect MainActivity source
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo '--- MAIN ACTIVITY ---'
          find app/src/main/java -name 'MainActivity.java' -o -name 'MainActivity.kt' | head -5
          FILE=$(find app/src/main/java -name 'MainActivity.java' -o -name 'MainActivity.kt' | head -1)
          echo "FILE=$FILE"
          sed -n '1,260p' "$FILE"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fix Kotlin dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat >> app/build.gradle <<'EOF'

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MemoPrinter80mm-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
